name = "omalo-graphics-website"
compatibility_date = "2026-07-29"
pages_build_output_dir = "."

# Resend — lets /functions/api/contact.js send a notification email
# when the contact form is submitted, via Resend's REST API. Requires:
# a Resend account, a verified sending domain, and an API key set as
# a Pages secret. See SETUP.md.

# Non-secret environment variables. Secrets (RESEND_API_KEY) should be
# added via the Pages dashboard (Settings > Environment variables > Encrypt)
# or `wrangler pages secret put`, NOT written here.
[vars]
CONTACT_EMAIL_TO = "you@yourdomain.com"
CONTACT_EMAIL_FROM = "noreply@yourdomain.com"
